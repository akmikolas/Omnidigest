# ===========================================
# OmniDigest 应用服务 (Application Only)
#
# 依赖: docker-compose.infra.yml（基础设施需先启动）
#
# 启动: docker-compose -f docker-compose.yml up -d --build
# 停止: docker-compose -f docker-compose.yml down
# ===========================================

services:
  # ---- Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - http_proxy
        - https_proxy
    image: omnidigest-backend:dev
    container_name: omnidigest_app
    restart: unless-stopped
    ports:
      - "7080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=omnidigest_postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-frank}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-omnidigest}
      - TZ=Asia/Shanghai
      - REDIS_HOST=omnidigest_redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - DGRAPH_ALPHA_URL=omnidigest_dgraph:9080
      - INIT_API_KEY_NAME=omni-init
      - KG_ENABLED=false
      - DISABLE_SCHEDULER=true
    volumes:
      - ./backend/src/templates:/app/templates
      - omnidigest_app_data:/data
    networks:
      - omnidigest_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: omnidigest-frontend:dev
    container_name: omnidigest_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - omnidigest_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  omnidigest_app_data:

networks:
  omnidigest_network:
    name: omnidigest_network
    external: true
